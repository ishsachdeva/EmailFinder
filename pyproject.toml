[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emailfinder"
version = "0.1.0"
description = "Local, configurable B2B prospecting foundation"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7", "SQLAlchemy>=2.0,<3", "pydantic>=2.7,<3",
  "PyYAML>=6,<7", "python-dotenv>=1,<2", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
emailfinder = "emailfinder.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emailfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

